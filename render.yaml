services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: panchayatmausam-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true

  # 2. React + Vite Frontend Static Site
  - type: web
    name: panchayatmausam-frontend
    env: static
    rootDir: .
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: panchayatmausam-backend
          property: url
          suffix: /api/v1
      - key: VITE_USE_BACKEND_API
        value: "true"
