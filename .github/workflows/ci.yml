name: PanchayatMausam AI CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend Linting, Typecheck & Production Build
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Verification & Vite Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_USE_BACKEND_API: 'true'

  # -------------------------------------------------------------
  # Job 2: FastAPI Backend Tests & ML Pipeline Verification
  # -------------------------------------------------------------
  backend-test:
    name: Backend API & ML Validation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize & Seed Database
        working-directory: ./backend
        run: |
          python seed.py --force

      - name: Validate ML Benchmark Models
        working-directory: ./backend
        run: |
          python -c "
          from app.core.database import SessionLocal
          from app.services.ml_service import MLService
          db = SessionLocal()
          res = MLService(db).train_models(force_retrain=True)
          print('ML Training Verified! Champions:', res.champions_selected)
          "

      - name: Run Crop-Risk Engine Verification Suite
        working-directory: ./backend
        run: |
          python test_risk_scenarios.py
