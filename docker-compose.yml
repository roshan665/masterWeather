version: '3.8'

services:
  # ==========================================
  # 1. PostgreSQL 16 with PostGIS Extension
  # ==========================================
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: panchayatmausam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-panchayatmausam}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-panchayatmausam}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - panchayat_net

  # ==========================================
  # 2. FastAPI Backend Web Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: panchayatmausam-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_2026}@db:5432/${POSTGRES_DB:-panchayatmausam}
      SECRET_KEY: ${SECRET_KEY:-panchayatmausam-super-secret-key-change-in-production-2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1}
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/analytics/telemetry-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - panchayat_net

  # ==========================================
  # 3. React + Vite Frontend (Nginx Alpine)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
        VITE_USE_BACKEND_API: "true"
    container_name: panchayatmausam-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - panchayat_net

networks:
  panchayat_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_storage:
    driver: local
